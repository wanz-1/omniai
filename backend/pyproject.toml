[project]
name = "omniai-backend"
version = "0.1.0"
description = "OmniAI Backend API - One AI. Unlimited Possibilities."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "OmniAI Team" }]
keywords = ["ai", "fastapi", "llm", "platform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core API
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "jinja2>=3.1.0",
    "python-slugify>=8.0.0",

    # Database & Cache
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",

    # Security & Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "pyotp>=2.9.0",
    "cryptography>=42.0.0",
    "passlib[bcrypt]>=1.7.4; python_version < '3.12'",  # deprecated, kept for transition, prefer bcrypt directly

    # Storage & HTTP
    "boto3>=1.34.0",
    "httpx>=0.27.0",

    # Observability
    "sentry-sdk[fastapi,sqlalchemy]>=2.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.20.0",

    # Background jobs
    "celery[redis]>=5.4.0",

    # File processing
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "reportlab>=4.1.0",
    "python-magic>=0.4.27; sys_platform != 'win32'",

    # Payments
    "stripe>=8.0.0",

    # AI Providers
    "openai>=1.35.0",
    "anthropic>=0.30.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",
    "qdrant-client>=1.9.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "coverage>=7.0.0",
    "factory-boy>=3.3.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic", "__pycache__"]

[tool.ruff.lint]
# Focus on high-value rules: errors, pyflakes, import sort, modernization, bug warnings
# ANN, N, SIM, RUF are valuable long-term but too noisy for current CI gate; kept as optional
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "E501",      # line too long – formatting, handled by formatter
    "B008",      # FastAPI Depends in defaults – intentional pattern
    "B028",      # No explicit stacklevel in warning
    "S101",      # assert in tests – allowed
    "S603", "S607",  # subprocess with shell=False is safe, but flagged – allow with review
    "S110",      # try-except-pass intentional in several fallback paths
    "S105", "S106",  # token_type false positive (not a password)
    "S112",      # try-except-continue intentional in auto-learn loops
    "S311",      # random for XP leveling, not crypto – safe
]
per-file-ignores = { "tests/*" = ["S101", "S106", "S107", "S105"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
