apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniai-celery-worker
  labels:
    app: omniai
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omniai
      tier: worker
  template:
    metadata:
      labels:
        app: omniai
        tier: worker
    spec:
      containers:
        - name: celery-worker
          image: omniai/backend:latest
          command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - configMapRef:
                name: omniai-config
            - secretRef:
                name: omniai-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            exec:
              command: ["celery", "-A", "app.tasks.celery_app", "status"]
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: omniai-celery-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: omniai-celery-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
