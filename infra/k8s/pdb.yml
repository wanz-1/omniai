apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: omniai-backend-pdb
  labels:
    app: omniai
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: omniai
      tier: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: omniai-frontend-pdb
  labels:
    app: omniai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: omniai
      tier: frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: omniai-worker-pdb
  labels:
    app: omniai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: omniai
      tier: worker
