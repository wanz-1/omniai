apiVersion: v1
kind: Secret
metadata:
  name: omniai-secrets
  labels:
    app: omniai
type: Opaque
stringData:
  # Required - generate with: openssl rand -hex 32
  secret_key: "change-this-to-a-random-64-char-hex-string"
  jwt_secret: "change-this-to-another-random-64-char-hex-string"
  db_password: "change-this-to-a-strong-password"

  # AI Provider Keys (optional - only configure what you use)
  openai_api_key: ""
  anthropic_api_key: ""
  google_gemini_api_key: ""
  deepseek_api_key: ""
  mistral_api_key: ""
  openrouter_api_key: ""

  # OAuth Keys (optional)
  oauth_google_client_id: ""
  oauth_google_client_secret: ""
  oauth_github_client_id: ""
  oauth_github_client_secret: ""
  oauth_microsoft_client_id: ""
  oauth_microsoft_client_secret: ""
  oauth_apple_client_id: ""
  oauth_apple_client_secret: ""

  # Storage
  s3_access_key: "minioadmin"
  s3_secret_key: "change-this-minio-password"

  # Stripe
  stripe_secret_key: ""
  stripe_webhook_secret: ""

  # Sentry
  sentry_dsn: ""
