version: "3.9"

services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
    environment:
      ENVIRONMENT: production
    restart: always

  celery-worker:
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
    restart: always

  frontend:
    build:
      args:
        - NEXT_PUBLIC_API_URL=https://api.omniai.app
        - NEXT_PUBLIC_WS_URL=wss://api.omniai.app/api/v1/ws
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256M
    restart: always
