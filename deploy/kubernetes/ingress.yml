apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omniai-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.omniai.example.com
        - api.omniai.example.com
      secretName: omniai-tls
  rules:
    - host: app.omniai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omniai-frontend
                port:
                  number: 3000
    - host: api.omniai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omniai-backend
                port:
                  number: 8000
