apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: omniai-postgres
  labels:
    app: omniai
    tier: database
spec:
  serviceName: omniai-postgres
  replicas: 1
  selector:
    matchLabels:
      app: omniai
      tier: database
  template:
    metadata:
      labels:
        app: omniai
        tier: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: omniai
            - name: POSTGRES_USER
              value: omniai
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omniai-secrets
                  key: db_password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: omniai-postgres
  labels:
    app: omniai
    tier: database
spec:
  selector:
    app: omniai
    tier: database
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
