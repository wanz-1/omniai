apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniai-backend
  labels:
    app: omniai
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: omniai
      tier: backend
  template:
    metadata:
      labels:
        app: omniai
        tier: backend
    spec:
      containers:
        - name: backend
          image: omniai/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: omniai-secrets
                  key: database_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: omniai-secrets
                  key: redis_url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: omniai-secrets
                  key: secret_key
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: omniai-secrets
                  key: stripe_secret_key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: omniai-secrets
                  key: openai_api_key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: omniai-backend
  labels:
    app: omniai
    tier: backend
spec:
  selector:
    app: omniai
    tier: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
